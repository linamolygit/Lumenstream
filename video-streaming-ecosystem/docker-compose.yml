version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: vse_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: streaming
      MYSQL_USER: streamer
      MYSQL_PASSWORD: streampass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: vse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
